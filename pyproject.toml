[project]
name = "langgraph-stock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "pycryptodome>=3.23.0",
    "pyqt6>=6.9.1",
    "pyside6>=6.9.1",
    "requests>=2.32.4",
    "websockets>=15.0.1",
    "celery>=5.6.3",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.0",
    "snowflake-sqlalchemy>=1.7.0",
    "yfinance>=1.7.0",
]

[project.scripts]
langgraph-stock = "langgraph_stock:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
